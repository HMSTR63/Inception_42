version: "3.2"

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/hmstr./data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/hmstr./data/mariadb
  portainer:
    driver: local

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: mariadb
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped
  nginx:
    build:
      context: ./requirements/nginx
    env_file:
      - .env
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
      - redis
    restart: unless-stopped
  wordpress:
    build:
      context: ./requirements/wordpress
    env_file:
      - .env
    container_name: wordpress
    secrets:
      - db_password
      - credentials
    networks:
      - inception
    volumes:
      - wordpress:/var/www/wordpress
    healthcheck:
      test: ["CMD-SHELL", "cat /run/php/php8.2-fpm.pid" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
  redis:
    build:
      context: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped
  adminer:
    build:
      context: ./requirements/bonus/adminer
    container_name: adminer
    networks:
      - inception
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    restart: unless-stopped
  website:
    build:
      context: ./requirements/bonus/static_website
    container_name: static_website
    networks:
      - inception
    ports:
      - "80:80"
    restart: unless-stopped
  ftp:
    build:
      context: ./requirements/bonus/ftp
    container_name: ftp
    networks:
      - inception
    env_file:
      - .env 
    secrets:
      - credentials
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped
  portainer:
    build:
      context: ./requirements/bonus/portainer
    container_name: portainer
    networks:
      - inception
    ports:
      - "9000:9000"
    volumes:
      - portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
